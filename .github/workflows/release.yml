name: Build System Release
on:
  workflow_dispatch:
    inputs:
      target:
        description: Image target (manual builds upload artifacts without creating a release)
        type: choice
        default: all
        options: [all, pi4, pi5, arm64, amd64]
  push:
    tags: ['v*']
permissions:
  contents: read
# Do not interrupt an image build or a draft upload when the same ref is retriggered.
concurrency:
  group: build-system-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Select targets and validate release identity
        id: plan
        env:
          REQUESTED_TARGET: ${{ inputs.target || 'all' }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const targets = ['pi4', 'pi5', 'arm64', 'amd64'];
          const release = process.env.GITHUB_EVENT_NAME === 'push';
          const requested = release ? 'all' : process.env.REQUESTED_TARGET;
          if (requested !== 'all' && !targets.includes(requested)) throw new Error('Unsupported image target');
          let version;
          if (release) {
            const source = JSON.parse(fs.readFileSync('packages/backend/source/modules/system/updates/source.json'));
            const tag = process.env.GITHUB_REF_NAME;
            if (process.env.GITHUB_REPOSITORY !== source.repository || !/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) throw new Error('Invalid release repository or version');
            version = tag.slice(1);
          } else {
            // Use one development version across all targets in this run.
            version = `${process.env.GITHUB_SHA.slice(0, 8)}-${new Date().toISOString().replace(/\D/g, '').slice(0, 14)}`;
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `targets=${JSON.stringify(requested === 'all' ? targets : [requested])}\nversion=${version}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Version: ${version}\n\nTargets: ${requested}\n\n${release ? 'Create a draft release after validation.' : 'Download build artifacts from this run; no release will be created.'}\n`);
          JS
  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
  images:
    needs: [prepare, checks]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    runs-on: ${{ matrix.target == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124
      - name: Build matching image and update bundle
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: make "image-$TARGET" VERSION="$BUILD_VERSION"
      - name: Verify and compress flash images
        working-directory: packages/system/build/images
        run: |
          for image in *.img; do
            sha256sum --check "$image.sha256"
            # XZ keeps large flash images below GitHub's 2 GiB asset limit.
            xz -T0 -6 "$image"
            sha256sum "$image.xz" > "$image.xz.sha256"
          done
          for checksum in *.rugixb.sha256; do
            sha256sum --check "$checksum"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: system-${{ matrix.target }}
          path: packages/system/build/images/*
          compression-level: 0
          if-no-files-found: error
  virtual-machine:
    name: AMD64 boot and persistence
    needs: [prepare, images]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'amd64')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install --yes qemu-system-x86 qemu-utils ovmf
      - uses: actions/download-artifact@v4
        with:
          name: system-amd64
          path: packages/system/build/images
      - name: Verify and unpack the test image
        working-directory: packages/system/build/images
        run: |
          shasum -a 256 -c umbrelos-amd64.img.xz.sha256
          xz -d umbrelos-amd64.img.xz
          shasum -a 256 -c umbrelos-amd64.img.sha256
      - run: make deps
      # Fresh images use key-only SSH. This scenario uses the owner Web terminal
      # and exercises real reboots and factory reset without changing SSH policy.
      - run: make test-vm TEST=source/modules/system/system-customization.vm.test.ts ARGS=--maxWorkers=1
  draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, images, virtual-machine]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: actions/download-artifact@v4
        with:
          pattern: system-*
          merge-multiple: true
          path: packages/system/build/images
      - name: Validate all bundles and assemble the release manifest
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: make release-manifest VERSION="$BUILD_VERSION"
      - name: Create a reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const dir = 'packages/system/build/images';
          for (const file of fs.readdirSync(dir)) if (fs.statSync(`${dir}/${file}`).size >= 2 * 1024 ** 3) throw new Error(`GitHub release asset is too large: ${file}`);
          JS
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "System ${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" packages/system/build/images/* --repo "$GITHUB_REPOSITORY"
