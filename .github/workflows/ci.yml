name: Verify System
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# Keep standalone verification separate from checks reused by image builds.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install application runner test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gettext-base jq
          curl --fail --location --retry 3 https://github.com/mikefarah/yq/releases/download/v4.24.5/yq_linux_amd64 --output /tmp/panel-test-yq
          echo 'c93a696e13d3076e473c3a43c06fdb98fafd30dc2f43bc771c4917531961c760  /tmp/panel-test-yq' | sha256sum --check
          sudo install -m 0755 /tmp/panel-test-yq /usr/local/bin/yq
      - run: make deps
      - run: make typecheck
      - run: make format-check
      - run: make lint
      - run: make translations-check
      - run: make test
      - run: make build-frontend
      - run: git diff --check
