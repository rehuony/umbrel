name: Verify system
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install application runner test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gettext-base jq
          curl --fail --location --retry 3 https://github.com/mikefarah/yq/releases/download/v4.24.5/yq_linux_amd64 --output /tmp/panel-test-yq
          echo 'c93a696e13d3076e473c3a43c06fdb98fafd30dc2f43bc771c4917531961c760  /tmp/panel-test-yq' | sha256sum --check
          sudo install -m 0755 /tmp/panel-test-yq /usr/local/bin/yq
      - run: make deps
      - run: make typecheck
      - run: make format-check
      - run: make lint
      - run: make translations-check
      - run: make test
      - run: make build-frontend
      - run: git diff --check
  images:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        target: [pi4, pi5, arm64, amd64]
    runs-on: ${{ matrix.target == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124
      - name: Build bootable image and checksum
        run: make image-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: system-${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          path: |
            packages/system/build/images/*.img
            packages/system/build/images/*.sha256
            packages/system/build/images/*.rugixb
            packages/system/build/images/*.update.json
  virtual-machine:
    if: github.event_name == 'workflow_dispatch'
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: sudo apt-get update && sudo apt-get install --yes qemu-system-x86 qemu-utils ovmf
      - uses: actions/download-artifact@v4
        with:
          name: system-amd64
          path: packages/system/build/images
      - run: cd packages/system/build/images && shasum -a 256 -c umbrelos-amd64.img.sha256
      - run: make deps
      - run: npm exec --prefix packages/backend -- playwright install --with-deps chromium
      - run: make test-vm ARGS='--maxWorkers=1 --minWorkers=1 --exclude **/*.pi.vm.test.ts'
